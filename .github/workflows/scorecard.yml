name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 3 * * 4"
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # Scorecard reads workflow runs for its checks
      security-events: write # upload the SARIF result to code scanning
      id-token: write # sign the published Scorecard result
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
