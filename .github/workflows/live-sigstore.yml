name: Live Sigstore

# Weekly, and on demand: refresh the public-good Sigstore trusted root over TUF
# with the real tuf-repo-cdn.sigstore.dev. Not a required check, and not part of
# ci.yml or the release gate, so a Sigstore outage can never block a release.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-sigstore:
    name: TUF update against tuf-repo-cdn.sigstore.dev
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.14.4"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.14.4

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Live TUF update
        run: uv run pytest tests/test_live_sigstore_0_18.py -m live -v
