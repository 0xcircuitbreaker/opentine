name: Nightly stress

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress:
    name: Stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120  # the 1,000-round prune race alone takes ~11 min on Linux
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
      fail-fast: false
    env:
      UV_PYTHON: "3.13"
      OPENTINE_STRESS: "1"
      OPENTINE_STRESS_PRUNE_ROUNDS: "1000"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.12"

      - name: Install dependencies
        shell: bash  # $UV_PYTHON is not expanded by PowerShell on Windows
        run: |
          uv python install "$UV_PYTHON"
          uv sync --locked --all-extras

      # Kills are SIGKILL on POSIX and TerminateProcess on Windows (Popen.kill).
      - name: Run stress tests
        shell: bash
        run: uv run --locked pytest tests/stress tests/test_036_ref_retry.py -m stress -v --durations=10
