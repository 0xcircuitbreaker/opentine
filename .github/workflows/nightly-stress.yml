name: Nightly stress

# 1.0 criterion 5: "Nightly stress tests have been green for 30 days."
# Each job writes its results under results/; the summary job turns them into
# nightly-summary.json (an artifact) and the run summary, and is red on a red
# night. scripts/stress_streak.py reads the green streak back from the API.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress:
    # Concurrent ref writers, kill -9 writers, gc/prune under load (1,000 rounds),
    # ref retry, and the merge-queue kill -9 chaos test at 64 entries.
    name: Stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150  # the 1,000-round prune race alone takes ~11 min on Linux
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
      fail-fast: false
    env:
      UV_PYTHON: "3.13"
      OPENTINE_STRESS: "1"
      OPENTINE_STRESS_PRUNE_ROUNDS: "1000"
      OPENTINE_STRESS_REF_UPDATES: "200"
      OPENTINE_STRESS_KILL_ROUNDS: "200"
      OPENTINE_STRESS_MQ_ENTRIES: "64"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        shell: bash  # $UV_PYTHON is not expanded by PowerShell on Windows
        run: |
          uv python install "$UV_PYTHON"
          uv sync --locked --all-extras

      # Kills are SIGKILL on POSIX and TerminateProcess on Windows (Popen.kill).
      - name: Run stress tests
        shell: bash
        run: >-
          uv run --locked pytest tests/stress tests/test_036_ref_retry.py
          "tests/test_047_merge_queue.py::test_kill_9_workers_never_double_merge"
          -v --durations=10 --junitxml "results/stress-${{ matrix.os }}.xml"

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-stress-${{ matrix.os }}
          path: results
          if-no-files-found: ignore

  coord-scale:
    # The full-size caps.coord test: 1,000 tasks x 50 workers, every 7th claim abandoned.
    name: Coordination scale (1,000 x 50)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run the scale test
        run: |
          mkdir -p results
          uv run --locked python scripts/coord_scale.py --tasks 1000 --workers 50 --crash-every 7 > results/coord-scale.json

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-coord-scale
          path: results
          if-no-files-found: ignore

  fuzz:
    # The OTLP ingest fuzzer for one hour a night (the per-PR job runs 1,000,000 inputs).
    name: Fuzz OTLP ingest (1 h)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Fuzz for one hour
        run: uv run --locked python scripts/fuzz_otlp.py --hours 1 --seed "$GITHUB_RUN_ID" --report-every 300

      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-fuzz-crashes
          path: fuzz-crashes
          if-no-files-found: ignore

  summary:
    name: Summary
    needs: [stress, coord-scale, fuzz]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # stress_streak.py lists this workflow's earlier runs
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Collect results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: nightly-*
          path: results

      - name: Summarise
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/nightly_summary.py results --needs "$NEEDS_JSON" --out nightly-summary.json --markdown "$GITHUB_STEP_SUMMARY"

      # 0.51: the streak (with committed flake waivers) as plain JSON, the same
      # shape as docs/bench/nightly-streak.json; exit 1 (streak not yet met) is
      # not a red night, exit 2 (API or waiver file unreadable) is.
      - name: Green streak
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/stress_streak.py --repo "$GITHUB_REPOSITORY" --branch "${GITHUB_REF_NAME}" \
            --write nightly-streak.json || [ $? -eq 1 ]

      - name: Keep the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-summary
          path: |
            nightly-summary.json
            nightly-streak.json
          if-no-files-found: ignore
