name: GitHub Release Artifacts

on:
  push:
    tags:
      - "v*"

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run fast gates
        run: |
          uv run python scripts/check_architecture.py
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests -m "not live and not live_harness" -q

      - name: Verify tag matches package version
        run: test "v$(uv run python -c 'import opentine; print(opentine.__version__)')" = "$GITHUB_REF_NAME"

      - name: Build package
        run: uv build --sdist --wheel --out-dir dist

      - name: Verify release inventory
        run: uv run python scripts/check_release_inventory.py dist

      - name: Check package metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Wheel smoke test
        run: uv run python scripts/wheel_smoke.py

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum opentine-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/opentine-*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opentine-release-artifacts
          path: |
            dist/opentine-*
            dist/SHA256SUMS

      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/opentine-* dist/SHA256SUMS --verify-tag --generate-notes
