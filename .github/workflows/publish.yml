name: Publish Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  gates:
    # The test suite needs every extra; it runs here, apart from the build job,
    # so the environment that produces the released bytes never installs test
    # tooling or provider SDKs.
    name: Run release gates
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.14.4"
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.14.4

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run fast gates
        run: |
          uv run python scripts/check_architecture.py
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests -m "not live and not live_harness" -q

  build:
    name: Build and validate distributions
    needs: gates
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.14.4"
    permissions:
      actions: read # query ci.yml runs for the release commit
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.14.4

      - name: Install build toolchain only
        run: uv sync --locked --no-default-groups --extra release

      - name: Verify release source and version
        shell: bash
        run: |
          set -x
          # actions/checkout leaves a lightweight tag pointing at the commit, so
          # re-fetch the real tag object from origin before asserting it is
          # annotated (a signed/dated tag is the release-integrity signal).
          git fetch --no-tags --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          # A tag-triggered checkout does not reliably populate the origin/main
          # tracking ref, so fetch it explicitly before the ancestry check.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$release_commit" origin/main
          # --no-sync so uv emits no build chatter that would pollute the capture.
          installed_version="$(uv run --no-sync python -c 'import opentine; print(opentine.__version__)')"
          test "v${installed_version}" = "$GITHUB_REF_NAME"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$release_commit")" >> "$GITHUB_ENV"

      - name: Require successful full CI for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(
            gh api \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&head_sha=$RELEASE_COMMIT&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )"
          test "$successful_runs" -ge 1

      - name: Build source distribution
        run: uv build --no-build-isolation --sdist --out-dir dist

      - name: Build wheel from source distribution
        shell: bash
        run: uv build --no-build-isolation --wheel dist/opentine-*.tar.gz --out-dir dist

      - name: Verify release inventory
        run: uv run python scripts/check_release_inventory.py dist

      - name: Check package metadata
        run: uv run python -m twine check dist/*

      - name: Wheel smoke test
        run: uv run python scripts/wheel_smoke.py

      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opentine-release-distributions
          path: |
            dist/opentine-*.whl
            dist/opentine-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Generate CycloneDX SBOM of the runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt \
            --output-file runtime-requirements.txt
          uvx --from cyclonedx-bom==8.0.1 cyclonedx-py requirements \
            --output-format JSON --output-file opentine.cdx.json runtime-requirements.txt

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opentine-sbom
          path: opentine.cdx.json
          if-no-files-found: error
          retention-days: 7

  artifact-smoke:
    name: Install the release artifacts (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.14.4"
      OPENTINE_WHEEL_SMOKE_DIST: release-dist
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      # CI smoke-tests a wheel it built itself on every OS; this installs the
      # exact validated files that are about to be published, on each OS,
      # before anything is released.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.14.4

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: opentine-release-distributions
          path: release-dist

      - name: Wheel smoke test
        run: uv run python scripts/wheel_smoke.py

  github-release:
    name: Attest and create GitHub release
    needs: [build, artifact-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build-provenance attestation
      attestations: write # store the attestation

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: opentine-release-distributions
          path: dist

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: opentine-sbom
          path: sbom

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          mv ../sbom/opentine.cdx.json .
          sha256sum opentine-*.whl opentine-*.tar.gz opentine.cdx.json > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/opentine-*.whl
            dist/opentine-*.tar.gz

      - name: Attach artifacts to GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/opentine-*.whl dist/opentine-*.tar.gz dist/opentine.cdx.json dist/SHA256SUMS
          --verify-tag --generate-notes

  pypi:
    name: Publish to PyPI with Trusted Publishing
    needs: [build, artifact-smoke, github-release]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/opentine
    permissions:
      contents: read
      id-token: write # mint the PyPI Trusted Publishing credential

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: opentine-release-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          attestations: true
