name: GitHub Release Artifacts

on:
  push:
    tags:
      - "v*"

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run fast gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests -m "not live and not live_harness" -q

      - name: Build package
        run: uv build --sdist --wheel --out-dir dist

      - name: Check package metadata
        run: uv run --with twine twine check dist/*

      - name: Wheel smoke test
        run: uv run python scripts/wheel_smoke.py

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum opentine-* > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opentine-release-artifacts
          path: |
            dist/opentine-*
            dist/SHA256SUMS

      - name: Attach artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/opentine-* dist/SHA256SUMS --verify-tag --generate-notes
