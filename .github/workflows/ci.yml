name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 0.54: the nightly and on-demand runs use the full matrix, like push to main.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  # 0.51: every commit on main keeps its own gate evidence (parity, peer-compat,
  # audit-kit, leave-service): main runs are grouped by SHA and never cancelled;
  # only superseded PR runs are.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 0.54: runner selection. Linux jobs below may run on the owner's ephemeral home
  # runners (label opentine-home, docs/CI-RUNNERS.md) only when the repository
  # variable USE_HOME_RUNNERS is the string 'true' AND the run is a push to main or
  # a workflow_dispatch. A pull_request (same-repo or fork) always resolves to a
  # hosted label; tests/test_054_ci_runner_policy.py fails the build otherwise.
  # With the variable unset every job runs hosted, exactly as before.

  prep:
    # 0.54: the once-per-run checks (lint, format, architecture, copy, build, twine,
    # wheel smoke, release inventory) run here once instead of in every matrix cell.
    # The test matrix needs this job, so a lint error fails the run in minutes.
    name: Lint, build and inventory
    runs-on: ${{ (vars.USE_HOME_RUNNERS == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) && 'opentine-home' || 'ubuntu-latest' }}
    timeout-minutes: 30  # a hung step fails the job instead of holding CI for 6 h
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Enforce trusted-kernel and module boundaries
        run: uv run python scripts/check_architecture.py

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Overclaim lint for docs copy
        run: uv run python scripts/check_copy.py

      - name: Build package
        run: uv build --no-build-isolation --sdist --wheel --out-dir dist

      - name: Verify release inventory
        run: uv run python scripts/check_release_inventory.py dist

      - name: Check package metadata
        run: uv run python -m twine check dist/*

      - name: Wheel smoke test
        run: uv run python scripts/wheel_smoke.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opentine-dist
          path: |
            dist/opentine-*.whl
            dist/opentine-*.tar.gz
          if-no-files-found: error

  package-os:
    # 0.54: the build and the release inventory still run on Windows and macOS
    # (a CRLF checkout must not break the inventory gate), once per OS and off the
    # test critical path.
    # The oldest supported Python also builds and smoke-tests the wheel here.
    name: Build and inventory (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a hung step fails the job instead of holding CI for 6 h
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        include:
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.14"}
          - {os: ubuntu-latest, python-version: "3.11"}
      fail-fast: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Set up Python
        shell: bash  # $UV_PYTHON is not expanded by PowerShell on Windows
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build package
        run: uv build --no-build-isolation --sdist --wheel --out-dir dist

      - name: Verify release inventory
        run: uv run python scripts/check_release_inventory.py dist

      - name: Check package metadata
        shell: bash
        run: uv run python -m twine check dist/*

      - name: Wheel smoke test
        run: uv run python scripts/wheel_smoke.py

  plan:
    # 0.54: pick the matrix (scripts/ci_plan.py). Pull requests get a slim matrix,
    # a TS-only pull request one Linux cell and a docs-only one none; push to main,
    # schedule and workflow_dispatch always get the full 3 OS x 4 Python matrix.
    name: Plan the test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.plan.outputs.python }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: List the files the pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # A failed fetch leaves the list empty, which plans the whole slim matrix.
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt" || : > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: python3 scripts/ci_plan.py --event "$EVENT" --changed "$RUNNER_TEMP/changed.txt"

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [prep, plan]
    if: needs.plan.outputs.python == 'true'
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.USE_HOME_RUNNERS == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) && 'opentine-home' || matrix.os }}
    timeout-minutes: 60  # a hung test fails the job instead of holding CI for 6 h
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
      TESTS: not live and not live_harness
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Exclude the workspace from Defender scanning (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Set up Python ${{ matrix.python-version }}
        shell: bash  # $UV_PYTHON is not expanded by PowerShell on Windows
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      # Parallel pass: pytest-xdist on every core; tests in one xdist_group share a
      # worker. pytest-split picks this cell's shard from the committed durations.
      - name: Run tests (parallel)
        shell: bash
        run: >-
          uv run pytest tests -m "$TESTS and not serial" -n auto --dist loadgroup
          --splits "$SHARDS" --group "$SHARD" --durations-path tests/test_durations.json -rfEs
          --timeout 600 --timeout-method thread --max-worker-restart 0
          -o faulthandler_timeout=540
        env:
          OPENTINE_TEST_TRACE_DIR: ${{ runner.temp }}/test-trace

      # Serial pass: tests marked serial share process-wide state and run alone.
      # Exit 5 (no serial test in this shard) is not a failure.
      - name: Run tests (serial)
        shell: bash
        run: >-
          uv run pytest tests -m "$TESTS and serial" -p no:xdist
          --splits "$SHARDS" --group "$SHARD" --durations-path tests/test_durations.json -rfEs
          --timeout 600 --timeout-method thread -o faulthandler_timeout=540
          || test $? -eq 5
        env:
          OPENTINE_TEST_TRACE_DIR: ${{ runner.temp }}/test-trace

      # A test killed by the per-test timeout takes its worker down; the trace
      # names the last test each worker started.
      - name: Upload test trace
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-trace-${{ runner.os }}-${{ matrix.python-version }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-trace
          if-no-files-found: ignore

  python-tests:
    # 0.54: one stable check name for branch protection. It passes when every
    # needed job passed, or the matrix was skipped by the plan (a docs-only pull
    # request), and fails when any of them failed or was cancelled.
    name: Python tests
    if: always()
    needs: [prep, package-os, plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass or be skipped by the plan
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

  next-python:
    # Preview of the next CPython release (pre-release builds). It never blocks a
    # merge: the job may fail, and the "Python tests" gate does not need it. The
    # job lifts the requires-python cap and re-resolves the lock in its own
    # checkout only, so breakage shows up here before the release ships.
    name: Test (ubuntu-latest, Python 3.15 preview, non-blocking)
    needs: [prep, plan]
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60  # a hung test fails the job instead of holding CI for 6 h
    env:
      UV_PYTHON: "3.15"
      TESTS: not live and not live_harness

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Newer than the main matrix pin: 0.11.12 only knows 3.15.0b1, whose
          # PyYAML source build crashes. This job tracks the latest pre-release.
          version: "0.11.32"

      - name: Set up Python 3.15 (pre-release)
        run: uv python install "$UV_PYTHON"

      - name: Lift the requires-python cap for this job only
        run: sed -i 's/requires-python = ">=3.11,<3.15"/requires-python = ">=3.11,<3.16"/' pyproject.toml

      - name: Install dependencies (re-resolved for 3.15)
        run: uv sync --all-extras

      # The release-toolchain test pins the committed requires-python cap, which
      # this job lifts on purpose above; every other test runs as in the matrix.
      - name: Run tests (parallel)
        run: >-
          uv run pytest tests -m "$TESTS and not serial" -n auto --dist loadgroup -rfEs
          --deselect tests/test_release_workflow.py::test_release_toolchain_is_locked_and_sdist_carries_the_lock

      - name: Run tests (serial)
        run: uv run pytest tests -m "$TESTS and serial" -p no:xdist -rfEs || test $? -eq 5

  audit-kit:
    # 0.49 (1.0 criterion 4): the audit kit verifies air-gapped on every OS. The
    # in-process checks run inside the offline guard and the kit's pyz refuses
    # the network itself; on Linux the verify step also runs in a network
    # namespace with no interface but loopback.
    name: Audit kit offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a hung check fails the job instead of holding CI for 6 h
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build an audit kit
        run: uv run python scripts/audit_kit_offline.py build kit

      - name: Verify the kit (offline guard)
        run: uv run --offline python scripts/audit_kit_offline.py verify kit

      - name: Verify the kit with networking disabled (Linux network namespace)
        if: runner.os == 'Linux'
        run: sudo unshare --net -- "$PWD/.venv/bin/python" scripts/audit_kit_offline.py verify kit

  parity:
    # 0.50 (1.0 criterion 2): the reference, the TS verifier and the built
    # tine-verify.pyz answer every pinned conformance case the same way. Any
    # disagreement, or a case one of them does not answer, fails the job.
    name: Python / TS / pyz vector parity
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # a hung run fails the job instead of holding CI for 6 h
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Build the TS verifier
        working-directory: ts/verifier
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Compare every case across the three implementations
        run: uv run python scripts/check_parity.py --require-ts

      # 0.53: every python, pyz and TS refusal names its pinned reason code.
      - name: Compare the reason code of every refusal
        run: uv run python scripts/check_parity.py --require-ts --reasons

  leave-service:
    # 0.50 (ROADMAP "leave the hosted service"): export a tenant from one tine serve,
    # import it into a fresh one and into a local repository, and get the same
    # `tine verify --offline` bytes. publish.yml releases only from a green main,
    # so this runs on every release from 0.50 on.
    name: Leave the hosted service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # a hung server fails the job instead of holding CI for 6 h
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Export, import, verify byte-identically
        run: uv run python -m pytest tests/test_050_leave_service.py -q

  ts-verifier:
    name: TS verifier (Node 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # a hung test fails the job instead of holding CI for 6 h
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ts/verifier

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and run the conformance vectors
        run: npm test

      - name: Build and test the TS SDK against the verifier just built
        working-directory: ts/sdk
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm audit --audit-level=low

      - name: Build and test the TS capture SDK
        working-directory: ts/capture
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm audit --audit-level=low

      - name: Build and test the VS Code extension (ide/vscode)
        working-directory: ide/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm audit --audit-level=low

      - name: Rebuild the run-viewer assets and require the committed copy
        working-directory: ts/run-viewer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- ../../opentine/data/ui

  browser-verifier:
    # 0.51: the full pinned conformance set and every bundle shape, verified in
    # Chromium, Firefox and WebKit by the browser build, must give ts/verifier's
    # Node verdicts; a >= 200 MiB bundle verifies with zero network requests.
    name: Browser verifier (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # a hung browser fails the job instead of holding CI for 6 h
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Build the TS verifier (the Node reference)
        working-directory: ts/verifier
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Install the harness and its browsers
        working-directory: ts/browser-tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=low
          npx playwright-core install --with-deps chromium firefox webkit

      - name: Run the conformance set and the bundles in every browser
        working-directory: ts/browser-tests
        env:
          OPENTINE_PYTHON: ${{ github.workspace }}/.venv/bin/python
          OPENTINE_BROWSER_LARGE: "1"
        run: npm test

  reference-loop:
    # 0.80: the reference self-improving loop on the stub model (no network, no
    # key), then every object and signed record it wrote is verified offline
    # by the Python verifier, a freshly built tine-verify.pyz and the TS
    # verifier; any disagreement or record that does not verify fails the job.
    name: Reference loop (stub model, verified by python, pyz and TS)
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a hung step fails the job instead of holding CI for 6 h
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Build the TS verifier
        working-directory: ts/verifier
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Run the loop and verify everything it wrote
        run: >-
          uv run python examples/self_improving_loop.py "$RUNNER_TEMP/reference-loop"
          --steps 6 --verify --require-ts

  fips:
    # 0.41 (X30): the real gate for --fips. cryptography is built against the
    # image's system OpenSSL 3 and runs with the FIPS provider forced on through
    # OPENSSL_CONF; tests that need the provider skip elsewhere.
    name: FIPS (UBI 9, OpenSSL 3 FIPS provider)
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a hung test fails the job instead of holding CI for 6 h
    permissions:
      contents: read
    container:
      image: registry.access.redhat.com/ubi9/python-311@sha256:a0bdb55576fc5b8d6704279307817828ef027e1065533ceba133fe9516003a6c
      options: --user 0
    defaults:
      run:
        shell: bash
    env:
      OPENSSL_CONF: /etc/pki/tls/openssl-fips-ci.cnf
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: dnf install -y --setopt=install_weak_deps=False openssl openssl-devel gcc libffi-devel rust cargo

      - name: Write a FIPS-only OpenSSL config
        run: |
          cat > "$OPENSSL_CONF" <<'CNF'
          config_diagnostics = 1
          openssl_conf = openssl_init
          [openssl_init]
          providers = provider_sect
          alg_section = algorithm_sect
          [provider_sect]
          fips = fips_sect
          base = base_sect
          [fips_sect]
          activate = 1
          [base_sect]
          activate = 1
          [algorithm_sect]
          default_properties = fips=yes
          CNF
          openssl list -providers

      - name: Build cryptography against the system OpenSSL
        # Setup runs with OpenSSL's defaults: under the FIPS-only config, venv's
        # ensurepip (and pip itself) exit 1. Only the tests below run FIPS-only.
        run: |
          OPENSSL_CONF=/dev/null python3.11 -m venv .venv
          OPENSSL_CONF=/dev/null .venv/bin/pip install --upgrade pip
          OPENSSL_CONF=/dev/null .venv/bin/pip install --no-binary cryptography "cryptography>=48.0.1"
          OPENSSL_CONF=/dev/null .venv/bin/pip install -e . pytest

      - name: Check the FIPS provider is active in cryptography
        run: |
          .venv/bin/python - <<'PY'
          from opentine import _fips
          status = _fips.status()
          print(status)
          assert status["provider_fips"], "FIPS provider is not active in cryptography"
          PY

      - name: Run the FIPS tests
        run: .venv/bin/python -m pytest tests/test_041_tineaes_fips.py -v -rs

      - name: tine --fips accepts an approved run
        run: .venv/bin/tine --fips ls

  fuzz-otlp:
    # 0.48: the scaled run of the OTLP protobuf/gRPC ingest fuzzer (an iteration
    # count, seeded per run). The 72 h acceptance run is scripts/fuzz_otlp.py --hours 72.
    # 0.53: the format-reader fuzzer (scripts/fuzz.py) runs scaled here too; its
    # 72 h run is OPENTINE_FUZZ_HOURS=72 (docs/RELEASING.md, "The 72-hour fuzz run").
    name: Fuzz OTLP ingest and format readers (scaled)
    runs-on: ${{ (vars.USE_HOME_RUNNERS == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) && 'opentine-home' || 'ubuntu-latest' }}
    timeout-minutes: 30  # a hung run fails the job instead of holding CI for 6 h
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Fuzz 1,000,000 mutated export requests
        run: uv run python scripts/fuzz_otlp.py --iterations 1000000 --seed "$GITHUB_RUN_ID" --report-every 60

      - name: Fuzz every format reader (20,000 inputs per target)
        run: uv run python scripts/fuzz.py --iterations 20000 --seed "$GITHUB_RUN_ID" --report-every 60

      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-otlp-crashes
          path: fuzz-crashes
          if-no-files-found: ignore

  peer-compat-034:
    # ROADMAP §2 invariant 5 (1.0 criterion 3): the published 0.34 CLI reads what
    # this tree writes (repository, pack, --for-legacy .tine, 0.46 project, 0.47 registry,
    # memory and tombstone records) and fetches from this tree's server over HTTP.
    # Pinned gaps (scripts/peer_compat_034.py KNOWN_GAPS) may only shrink.
    name: 0.34 peer compatibility
    runs-on: ${{ (vars.USE_HOME_RUNNERS == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')) && 'opentine-home' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Install the published 0.34.0 in its own venv
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/v034"
          uv pip install --python "$RUNNER_TEMP/v034/bin/python" "opentine[zstd]==0.34.0"

      - name: 0.34 reads and fetches what this tree writes and serves
        run: uv run --locked python scripts/peer_compat_034.py --old-python "$RUNNER_TEMP/v034/bin/python" --out peer-compat-034.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: peer-compat-034
          path: peer-compat-034.json
          if-no-files-found: ignore
