name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120  # a hung test fails the job instead of holding CI for 6 h
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Set up Python ${{ matrix.python-version }}
        shell: bash  # $UV_PYTHON is not expanded by PowerShell on Windows
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Enforce trusted-kernel and module boundaries
        run: uv run python scripts/check_architecture.py

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest tests -m "not live and not live_harness" -v

      - name: Build package
        run: uv build --no-build-isolation --sdist --wheel --out-dir dist

      - name: Verify release inventory
        run: uv run python scripts/check_release_inventory.py dist

      - name: Check package metadata
        run: uv run python -m twine check dist/*

      - name: Wheel smoke test
        run: uv run python scripts/wheel_smoke.py

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opentine-dist
          path: |
            dist/opentine-*.whl
            dist/opentine-*.tar.gz
          if-no-files-found: error

  ts-verifier:
    name: TS verifier (Node 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # a hung test fails the job instead of holding CI for 6 h
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ts/verifier

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and run the conformance vectors
        run: npm test

      - name: Build and test the TS SDK against the verifier just built
        working-directory: ts/sdk
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm audit --audit-level=low

      - name: Build and test the TS capture SDK
        working-directory: ts/capture
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm audit --audit-level=low

      - name: Build and test the VS Code extension (ide/vscode)
        working-directory: ide/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm audit --audit-level=low

      - name: Rebuild the run-viewer assets and require the committed copy
        working-directory: ts/run-viewer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- ../../opentine/data/ui

  fips:
    # 0.41 (X30): the real gate for --fips. cryptography is built against the
    # image's system OpenSSL 3 and runs with the FIPS provider forced on through
    # OPENSSL_CONF; tests that need the provider skip elsewhere.
    name: FIPS (UBI 9, OpenSSL 3 FIPS provider)
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a hung test fails the job instead of holding CI for 6 h
    permissions:
      contents: read
    container:
      image: registry.access.redhat.com/ubi9/python-311@sha256:a0bdb55576fc5b8d6704279307817828ef027e1065533ceba133fe9516003a6c
      options: --user 0
    defaults:
      run:
        shell: bash
    env:
      OPENSSL_CONF: /etc/pki/tls/openssl-fips-ci.cnf
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: dnf install -y --setopt=install_weak_deps=False openssl openssl-devel gcc libffi-devel rust cargo

      - name: Write a FIPS-only OpenSSL config
        run: |
          cat > "$OPENSSL_CONF" <<'CNF'
          config_diagnostics = 1
          openssl_conf = openssl_init
          [openssl_init]
          providers = provider_sect
          alg_section = algorithm_sect
          [provider_sect]
          fips = fips_sect
          base = base_sect
          [fips_sect]
          activate = 1
          [base_sect]
          activate = 1
          [algorithm_sect]
          default_properties = fips=yes
          CNF
          openssl list -providers

      - name: Build cryptography against the system OpenSSL
        # Setup runs with OpenSSL's defaults: under the FIPS-only config, venv's
        # ensurepip (and pip itself) exit 1. Only the tests below run FIPS-only.
        run: |
          OPENSSL_CONF=/dev/null python3.11 -m venv .venv
          OPENSSL_CONF=/dev/null .venv/bin/pip install --upgrade pip
          OPENSSL_CONF=/dev/null .venv/bin/pip install --no-binary cryptography "cryptography>=48.0.1"
          OPENSSL_CONF=/dev/null .venv/bin/pip install -e . pytest

      - name: Check the FIPS provider is active in cryptography
        run: |
          .venv/bin/python - <<'PY'
          from opentine import _fips
          status = _fips.status()
          print(status)
          assert status["provider_fips"], "FIPS provider is not active in cryptography"
          PY

      - name: Run the FIPS tests
        run: .venv/bin/python -m pytest tests/test_041_tineaes_fips.py -v -rs

      - name: tine --fips accepts an approved run
        run: .venv/bin/tine --fips ls

  fuzz-otlp:
    # 0.48: the scaled run of the OTLP protobuf/gRPC ingest fuzzer (an iteration
    # count, seeded per run). The 72 h acceptance run is scripts/fuzz_otlp.py --hours 72.
    name: Fuzz OTLP ingest (scaled)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung run fails the job instead of holding CI for 6 h
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Fuzz 1,000,000 mutated export requests
        run: uv run python scripts/fuzz_otlp.py --iterations 1000000 --seed "$GITHUB_RUN_ID" --report-every 60

      - name: Keep crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-otlp-crashes
          path: fuzz-crashes
          if-no-files-found: ignore
