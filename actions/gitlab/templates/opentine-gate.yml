# OpenTine gate as a GitLab CI/CD component: `tine verify`, `tine eval verify`,
# a remote's signed admission VSA, and one merge-request note with the verdicts.
#
#   include:
#     - project: <group>/opentine
#       ref: <tag>
#       file: actions/gitlab/templates/opentine-gate.yml
#       inputs:
#         runs: "runs/build.tine"
#         vsa: "vsa.json"
#         vsa-key: "server-vsa.pub"
#         subject: "run:..."
#
# Least privilege: the job needs no token to gate. The MR note needs a project
# access token with `api` scope in a masked, protected CI/CD variable named
# OPENTINE_GITLAB_TOKEN; without it the note is skipped and the gate still
# decides the job. The token is sent only in a request header and never printed.
# Inputs reach the script through `variables:`, never as interpolated script text.
spec:
  inputs:
    stage:
      default: test
    job-name:
      default: opentine-gate
    image:
      default: python:3.12-slim
    opentine-version:
      default: "0.46.0"
      regex: ^[0-9]+\.[0-9]+\.[0-9]+$
    runs:
      default: ""
    pubkey:
      default: ""
    eval-dirs:
      default: ""
    eval-pubkey:
      default: ""
    vsa:
      default: ""
    vsa-key:
      default: ""
    subject:
      default: ""
    vsa-policy:
      default: ""
    vsa-levels:
      default: ""
    comment:
      default: "true"
      options: ["true", "false"]
---
"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  variables:
    OPENTINE_VERSION: "$[[ inputs.opentine-version ]]"
    RUNS: "$[[ inputs.runs ]]"
    PUBKEY: "$[[ inputs.pubkey ]]"
    EVAL_DIRS: "$[[ inputs.eval-dirs ]]"
    EVAL_PUBKEY: "$[[ inputs.eval-pubkey ]]"
    VSA: "$[[ inputs.vsa ]]"
    VSA_KEY: "$[[ inputs.vsa-key ]]"
    SUBJECT: "$[[ inputs.subject ]]"
    VSA_POLICY: "$[[ inputs.vsa-policy ]]"
    VSA_LEVELS: "$[[ inputs.vsa-levels ]]"
    OPENTINE_COMMENT: "$[[ inputs.comment ]]"
    OUT: opentine-gate
  script:
    - python -m pip install --quiet --disable-pip-version-check "opentine==${OPENTINE_VERSION}"
    - status=0
    - python -m opentine._ci_run || status=$?
    - |
      if [ "$OPENTINE_COMMENT" = "true" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        python -m opentine._ci_comment gitlab --body "$OUT/comment.md" || true
      fi
    - exit "$status"
  artifacts:
    when: always
    paths:
      - opentine-gate/summary.json
      - opentine-gate/comment.md
