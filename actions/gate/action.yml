name: OpenTine gate
description: >-
  Run `tine verify` and `tine eval verify`, check a remote's signed admission
  VSA, and post one PR comment with the verdicts.
author: OpenTine
branding:
  icon: shield
  color: green

# Least privilege. The job that uses this action needs only:
#   permissions:
#     contents: read
#     pull-requests: write   # only when `comment: "true"`
# The token is passed in `github-token`, reaches the comment step only, and is
# never printed. Every input reaches the shell through `env:`, never through
# `${{ }}` inside a script, so an input cannot inject shell code.
# A run or eval given without `pubkey`/`eval-pubkey` fails as `unpinned`. Read
# `pubkey` and `vsa-key` from a place the PR cannot change (the base branch, a
# secret or a variable): a key from the PR's own checkout lets its author sign
# their own artifacts. The PR comment is a courtesy: a token that cannot write
# it (a fork PR) only logs a warning; the gate step decides the job.

inputs:
  runs:
    description: Newline-separated .tine run artifacts to `tine verify`.
    required: false
    default: ""
  pubkey:
    description: Public key file the runs must be signed by (`tine verify --pubkey`).
    required: false
    default: ""
  eval-dirs:
    description: Newline-separated eval folders to `tine eval verify`.
    required: false
    default: ""
  eval-pubkey:
    description: Public key for `tine eval verify --pubkey`.
    required: false
    default: ""
  evals-config:
    description: >-
      A .tine/evals.toml to run with `tine eval ci` (0.47) before the gate; its
      eval folders join `eval-dirs` and a missed `min_pass_rate` fails the job.
    required: false
    default: ""
  eval-key-file:
    description: Ed25519 private key file that signs the `evals-config` verdicts.
    required: false
    default: ""
  vsa:
    description: A remote's DSSE-signed admission VSA (SPEC 8.17) to gate on.
    required: false
    default: ""
  vsa-key:
    description: The remote's pinned Ed25519 VSA public key (PEM, raw or base64url).
    required: false
    default: ""
  subject:
    description: The object id the VSA must admit (for example `run:<hex>`).
    required: false
    default: ""
  vsa-resource:
    description: Required `tine://TENANT/REF` the VSA must name (stops cross-tenant replay).
    required: false
    default: ""
  vsa-policy:
    description: Required policy URI, for example `opentine:trust-policy/prod`.
    required: false
    default: ""
  vsa-levels:
    description: Space-separated levels the VSA must record.
    required: false
    default: ""
  comment:
    description: Post or update one PR comment with the verdicts ("true"/"false").
    required: false
    default: "true"
  github-token:
    description: "Token for the comment (needs pull-requests write)."
    required: false
    default: ${{ github.token }}
  opentine-version:
    description: Exact opentine version to install from PyPI (pinned).
    required: false
    default: "0.46.0"

outputs:
  ok:
    description: '"true" when every check passed.'
    value: ${{ steps.gate.outputs.ok }}
  summary:
    description: Path of the tine-ci-gate/1 summary JSON.
    value: ${{ steps.gate.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Install opentine (pinned)
      shell: bash
      env:
        OPENTINE_VERSION: ${{ inputs.opentine-version }}
      run: |
        set -euo pipefail
        case "$OPENTINE_VERSION" in
          *[!0-9.]*|"") echo "opentine-version must be an exact X.Y.Z" >&2; exit 2 ;;
        esac
        python3 -m venv "$RUNNER_TEMP/opentine-venv"
        "$RUNNER_TEMP/opentine-venv/bin/python" -m pip install --quiet --disable-pip-version-check "opentine==$OPENTINE_VERSION"
        echo "$RUNNER_TEMP/opentine-venv/bin" >> "$GITHUB_PATH"

    - name: Verify, eval and gate
      id: gate
      shell: bash
      env:
        RUNS: ${{ inputs.runs }}
        PUBKEY: ${{ inputs.pubkey }}
        EVAL_DIRS: ${{ inputs.eval-dirs }}
        EVALS_CONFIG: ${{ inputs.evals-config }}
        EVAL_KEY_FILE: ${{ inputs.eval-key-file }}
        EVAL_PUBKEY: ${{ inputs.eval-pubkey }}
        VSA: ${{ inputs.vsa }}
        VSA_KEY: ${{ inputs.vsa-key }}
        SUBJECT: ${{ inputs.subject }}
        VSA_RESOURCE: ${{ inputs.vsa-resource }}
        VSA_POLICY: ${{ inputs.vsa-policy }}
        VSA_LEVELS: ${{ inputs.vsa-levels }}
        OUT: ${{ runner.temp }}/opentine-gate
      run: |
        set -uo pipefail
        if [ -n "$EVALS_CONFIG" ]; then
          mkdir -p "$OUT"
          if tine eval ci --config "$EVALS_CONFIG" --key "$EVAL_KEY_FILE" --out "$OUT/evals" --json > "$OUT/evals.json"; then
            echo "evals_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "evals_ok=false" >> "$GITHUB_OUTPUT"
          fi
          found="$(python3 -c 'import json,sys; print("\n".join(e["dir"] for e in json.load(open(sys.argv[1])).get("evals", [])))' "$OUT/evals.json" || true)"
          EVAL_DIRS="$(printf '%s\n%s' "$EVAL_DIRS" "$found")"
          export EVAL_DIRS
        fi
        python -m opentine._ci_run

    - name: PR comment
      if: ${{ always() && inputs.comment == 'true' && github.event.pull_request.number }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENTINE_PR: ${{ github.event.pull_request.number }}
        BODY: ${{ runner.temp }}/opentine-gate/comment.md
      run: python -m opentine._ci_comment github --body "$BODY"

    - name: Fail on a missed eval gate
      if: ${{ always() && inputs.evals-config != '' && steps.gate.outputs.evals_ok != 'true' }}
      shell: bash
      run: |
        echo "tine eval ci: an eval missed its min_pass_rate or could not run" >&2
        exit 1
