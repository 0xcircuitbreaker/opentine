# OpenTine compliance profile: EU AI Act record-keeping and log retention.
# Draft, not legal advice, pending counsel review. Written in YAML's
# JSON-compatible flow style so the standard library reads it (SPEC 12.5).
{
  "profile": "eu-ai-act",
  "profile_version": 1,
  "title": "EU AI Act Art. 12, 19, 26: logging and log retention for high-risk AI systems",
  "jurisdiction": "European Union",
  "notice": "draft — not legal advice, pending counsel review",
  "counsel_review": "outstanding",
  "sources": [
    {
      "id": "ai-act",
      "title": "Regulation (EU) 2024/1689 (Artificial Intelligence Act), OJ L, 12.7.2024, Articles 12, 19 and 26",
      "url": "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    }
  ],
  "requirements": [
    {
      "id": "art12.1.automatic-logs",
      "cite": "Regulation (EU) 2024/1689 Art. 12(1)",
      "text": "High-risk AI systems shall technically allow for the automatic recording of events (logs) over the lifetime of the system.",
      "scope": "in",
      "evidence": ["log.events", "integrity"],
      "note": "Evidence for one run's log; 'over the lifetime of the system' is a deployment property one run cannot show."
    },
    {
      "id": "art12.2.traceability",
      "cite": "Regulation (EU) 2024/1689 Art. 12(2)(a)-(c)",
      "text": "Logging enables recording of events relevant for identifying risk situations (Art. 79(1)) or substantial modification, post-market monitoring (Art. 72) and monitoring of operation (Art. 26(5)).",
      "scope": "in",
      "evidence": ["log.events", "log.period", "integrity"],
      "note": "Which events are relevant is system-specific and for the provider's risk analysis."
    },
    {
      "id": "art12.3.a.period-of-use",
      "cite": "Regulation (EU) 2024/1689 Art. 12(3)(a)",
      "text": "Recording of the period of each use (start date and time and end date and time); mandatory for Annex III point 1(a) systems only.",
      "scope": "in",
      "evidence": ["log.period"],
      "note": "Applies by law only to remote biometric identification systems; reported for every run as good practice."
    },
    {
      "id": "art12.3.b-d.biometric",
      "cite": "Regulation (EU) 2024/1689 Art. 12(3)(b)-(d)",
      "text": "The reference database, the input data that led to a match, and the natural persons verifying results (Art. 14(5)).",
      "scope": "out",
      "evidence": [],
      "note": "Domain data of biometric systems; OpenTine records it only if the agent's steps carry it."
    },
    {
      "id": "art19.1.provider-retention",
      "cite": "Regulation (EU) 2024/1689 Art. 19(1)",
      "text": "Providers keep the automatically generated logs under their control for a period appropriate to the intended purpose, of at least six months.",
      "scope": "in",
      "evidence": ["retention.six-months", "integrity"],
      "note": "Six months is checked as 183 days; Union or national law, including data protection law, may set another period."
    },
    {
      "id": "art19.2.financial-institutions",
      "cite": "Regulation (EU) 2024/1689 Art. 19(2)",
      "text": "Providers that are financial institutions keep the logs as part of the documentation kept under financial services law.",
      "scope": "out",
      "evidence": [],
      "note": "Organisational: where the logs are filed."
    },
    {
      "id": "art26.5.monitoring",
      "cite": "Regulation (EU) 2024/1689 Art. 26(5)",
      "text": "Deployers monitor the operation of the high-risk AI system on the basis of the instructions for use.",
      "scope": "in",
      "evidence": ["log.events", "signature.authenticated"],
      "note": "A signed log is the monitoring record; the monitoring itself and any reporting to providers or authorities are organisational."
    },
    {
      "id": "art26.6.deployer-retention",
      "cite": "Regulation (EU) 2024/1689 Art. 26(6)",
      "text": "Deployers keep the logs automatically generated by the system, to the extent under their control, for at least six months.",
      "scope": "in",
      "evidence": ["retention.six-months", "custody"],
      "note": "Six months is checked as 183 days; the custody log shows the logs stayed under the deployer's control."
    },
    {
      "id": "art26.1-4.organisational",
      "cite": "Regulation (EU) 2024/1689 Art. 26(1), (2), (4)",
      "text": "Use in accordance with the instructions for use, competent human oversight, and relevant and representative input data.",
      "scope": "out",
      "evidence": [],
      "note": "Organisational obligations no log can evidence on its own."
    }
  ]
}
