# OpenTine compliance profile: US Federal Rules of Evidence 902(13) and 902(14).
# Draft, not legal advice, pending counsel review. Written in YAML's
# JSON-compatible flow style so the standard library reads it (SPEC 12.5).
{
  "profile": "fre-902",
  "profile_version": 1,
  "title": "US FRE 902(13)/(14): self-authenticating electronic records",
  "jurisdiction": "United States (federal courts)",
  "notice": "draft — not legal advice, pending counsel review",
  "counsel_review": "outstanding",
  "sources": [
    {
      "id": "fre",
      "title": "Federal Rules of Evidence, Rules 803(6), 901(b)(9), 902(11), 902(13), 902(14) (902(13)-(14) effective 1 December 2017)",
      "url": "https://www.law.cornell.edu/rules/fre/rule_902"
    }
  ],
  "requirements": [
    {
      "id": "902-13.electronic-process",
      "cite": "FRE 902(13)",
      "text": "The record was generated by an electronic process or system.",
      "scope": "in",
      "evidence": ["log.events", "integrity"],
      "note": "OpenTine's capture writes each step as it happens; the digest shows the file is the one the capture wrote."
    },
    {
      "id": "902-13.accurate-result",
      "cite": "FRE 902(13); FRE 901(b)(9)",
      "text": "Part of showing the process or system produces an accurate result: the record offered is the unaltered output the identified recorder signed. Whether the agent's output is itself accurate is not evidenced here.",
      "scope": "in",
      "evidence": ["integrity", "signature.authenticated"],
      "note": "Shows the record is unaltered since it was signed. Whether the agent itself produced an accurate result is for the certifying witness."
    },
    {
      "id": "901-b-9.independent-capture",
      "cite": "FRE 901(b)(9)",
      "text": "Evidence describing the process or system and showing that it produces an accurate result (corroboration of the capture path).",
      "scope": "in",
      "evidence": ["capture.independent", "timestamp"],
      "note": "Assurance tier T2 or higher (a proxy witnessed the capture) and an RFC 3161 token corroborate when and how the record was made."
    },
    {
      "id": "902-14.digital-identification",
      "cite": "FRE 902(14)",
      "text": "Data copied from an electronic device, storage medium or file, authenticated by a process of digital identification.",
      "scope": "in",
      "evidence": ["integrity"],
      "note": "The sha256 integrity digest (SPEC 3.5) is a hash value of the kind the Advisory Committee note to 902(14) describes."
    },
    {
      "id": "902-14.copy-chain",
      "cite": "FRE 902(14); FRE 901(a)",
      "text": "The copy offered is shown to be a copy of the original data (chain of custody of the copy).",
      "scope": "in",
      "evidence": ["custody"],
      "note": "A verified `tine custody` log in --repo records who received, exported and transferred the run."
    },
    {
      "id": "902-11.certification",
      "cite": "FRE 902(11), incorporated by 902(13) and 902(14)",
      "text": "A certification of the custodian or another qualified person that complies with a federal statute or a rule prescribed by the Supreme Court.",
      "scope": "out",
      "evidence": [],
      "note": "A human declaration (for example under 28 U.S.C. 1746); a `tine verify --offline --report` can be its exhibit."
    },
    {
      "id": "902-11.notice",
      "cite": "FRE 902(11) notice, incorporated by 902(13) and 902(14)",
      "text": "Reasonable written notice to the adverse party before the trial or hearing, with the record and certification available for inspection.",
      "scope": "out",
      "evidence": [],
      "note": "A litigation step; `tine evidence export --with-verifier` writes a folder the adverse party can inspect offline."
    },
    {
      "id": "803-6.regular-practice",
      "cite": "FRE 803(6)(A)-(C), through 902(11)",
      "text": "Made at or near the time, kept in the course of a regularly conducted activity, making it a regular practice.",
      "scope": "out",
      "evidence": [],
      "note": "902(13) does not itself require a business record, but a 902(11)-style certification often relies on one; the practice is organisational."
    }
  ]
}
