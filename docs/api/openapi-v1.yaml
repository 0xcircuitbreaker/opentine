          anyOf:
            - minimum: 0
              type: "integer"
            - type: "null"
        method:
          type: "string"
        subject:
          type: "string"
        tenants:
          items:
            $ref: "#/components/schemas/Tenant"
          type: "array"
      required:
        - "expires_at"
        - "method"
        - "subject"
        - "tenants"
      type: "object"
    SessionEnded:
      additionalProperties: false
      properties:
        ended:
          type: "boolean"
      required:
        - "ended"
      type: "object"
    SessionOpened:
      additionalProperties: false
      properties:
        expires_at:
          minimum: 0
          type: "integer"
        method:
          type: "string"
        subject:
          type: "string"
        token:
          pattern: "^tine_sess_"
          type: "string"
      required:
        - "expires_at"
        - "method"
        - "subject"
        - "token"
      type: "object"
    SettingsUpdate:
      additionalProperties: false
      properties:
        default_ref:
          anyOf:
            - type: "string"
            - type: "null"
        description:
          anyOf:
            - type: "string"
            - type: "null"
        homepage:
          anyOf:
            - type: "string"
            - type: "null"
      required: []
      type: "object"
    Share:
      properties:
        created:
          minimum: 0
          type: "integer"
        created_by:
          type: "string"
        expires:
          minimum: 0
          type: "integer"
        id:
          pattern: "^[0-9a-f]{16}$"
          type: "string"
        run:
          pattern: "^(blob|event|run|attestation|annotation):sha256:[0-9a-f]{64}$"
          type: "string"
        scope:
          enum:
            - "read"
        state:
          enum:
            - "active"
            - "expired"
            - "revoked"
        token:
          pattern: "^tine_share_[A-Za-z0-9_-]{43}$"
          type: "string"
      required:
        - "created"
        - "created_by"
        - "expires"
        - "id"
        - "run"
        - "scope"
        - "state"
      type: "object"
    ShareList:
      additionalProperties: false
      properties:
        shares:
          items:
            $ref: "#/components/schemas/Share"
          type: "array"
      required:
        - "shares"
      type: "object"
    ShareRequest:
      additionalProperties: false
      properties:
        run:
          pattern: "^(blob|event|run|attestation|annotation):sha256:[0-9a-f]{64}$"
          type: "string"
        scope:
          enum:
            - "read"
        ttl:
          minimum: 1
          type: "integer"
      required:
        - "run"
      type: "object"
    SharedRun:
      additionalProperties: false
      properties:
        expires:
          minimum: 0
          type: "integer"
        run:
          pattern: "^(blob|event|run|attestation|annotation):sha256:[0-9a-f]{64}$"
          type: "string"
        scope:
          enum:
            - "read"
      required:
        - "expires"
        - "run"
        - "scope"
      type: "object"
    SocialCounts:
      additionalProperties: false
      properties:
        stars:
          minimum: 0
          type: "integer"
        watches:
          minimum: 0
          type: "integer"
      required:
        - "stars"
        - "watches"
      type: "object"
    Task:
      additionalProperties: false
      properties:
        fencing:
          minimum: 0
          type: "integer"
        holder:
          anyOf:
            - type: "string"
            - type: "null"
        lease_expires_ms:
          anyOf:
            - minimum: 0
              type: "integer"
            - type: "null"
        status:
          enum:
            - "open"
            - "claimed"
            - "done"
        task:
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
          type: "string"
        title:
          type: "string"
        updated_ms:
          minimum: 0
          type: "integer"
      required:
        - "fencing"
        - "holder"
        - "lease_expires_ms"
        - "status"
        - "task"
        - "title"
        - "updated_ms"
      type: "object"
    TaskAdd:
      additionalProperties: false
      properties:
        task:
          type: "string"
        title:
          type: "string"
      required:
        - "task"
      type: "object"
    TaskLease:
      additionalProperties: false
      properties:
        fencing:
          minimum: 0
          type: "integer"
        holder:
          type: "string"
        ttl:
          minimum: 0
          type: "number"
      required:
        - "holder"
      type: "object"
    TaskList:
      additionalProperties: false
      properties:
        tasks:
          items:
            $ref: "#/components/schemas/Task"
          type: "array"
      required:
        - "tasks"
      type: "object"
    TaskReply:
      additionalProperties: false
      properties:
        task:
          $ref: "#/components/schemas/Task"
      required:
        - "task"
      type: "object"
    Tenant:
      additionalProperties: false
      properties:
        archived:
          type: "boolean"
        created_at:
          anyOf:
            - minimum: 0
              type: "integer"
            - type: "null"
        display_name:
          type: "string"
        name:
          type: "string"
        role:
          anyOf:
            - enum:
                - "reader"
                - "writer"
                - "admin"
            - type: "null"
      required:
        - "archived"
        - "created_at"
        - "display_name"
        - "name"
        - "role"
      type: "object"
    TenantCreate:
      additionalProperties: false
      properties:
        display_name:
          type: "string"
        name:
          type: "string"
      required:
        - "name"
      type: "object"
    TenantList:
      additionalProperties: false
      properties:
        tenants:
          items:
            additionalProperties: false
            properties:
              archived:
                type: "boolean"
              created_at:
                anyOf:
                  - minimum: 0
                    type: "integer"
                  - type: "null"
              display_name:
                type: "string"
              name:
                type: "string"
              role:
                anyOf:
                  - enum:
                      - "reader"
                      - "writer"
                      - "admin"
                  - type: "null"
            required:
              - "archived"
              - "created_at"
              - "display_name"
              - "name"
              - "role"
            type: "object"
          type: "array"
      required:
        - "tenants"
      type: "object"
    TenantRename:
      additionalProperties: false
      properties:
        display_name:
          type: "string"
      required:
        - "display_name"
      type: "object"
    TenantSettings:
      additionalProperties: false
      properties:
        limits:
          additionalProperties:
            minimum: 0
            type: "integer"
          type: "object"
        settings:
          additionalProperties: false
          properties:
            default_ref:
              type: "string"
            description:
              type: "string"
            homepage:
              type: "string"
          required: []
          type: "object"
      required:
        - "limits"
        - "settings"
      type: "object"
    TokenList:
      properties:
        tokens:
          items:
            properties:
              access:
                enum:
                  - "read"
                  - "write"
              created_at:
                type: "string"
              expires_at:
                type: "string"
              id:
                pattern: "^[0-9a-f]{16}$"
                type: "string"
              kind:
                enum:
                  - "pat"
                  - "ci"
              label:
                type: "string"
              refs:
                items:
                  type: "string"
                type: "array"
              revoked_at:
                type: "string"
              state:
                enum:
                  - "active"
                  - "expired"
                  - "revoked"
              tenant:
                type: "string"
            required:
              - "access"
              - "created_at"
              - "expires_at"
              - "id"
              - "kind"
              - "refs"
              - "state"
              - "tenant"
            type: "object"
          type: "array"
      required:
        - "tokens"
      type: "object"
    TokenRecord:
      properties:
        access:
          enum:
            - "read"
            - "write"
        created_at:
          type: "string"
        expires_at:
          type: "string"
        id:
          pattern: "^[0-9a-f]{16}$"
          type: "string"
        kind:
          enum:
            - "pat"
            - "ci"
        label:
          type: "string"
        refs:
          items:
            type: "string"
          type: "array"
        revoked_at:
          type: "string"
        state:
          enum:
            - "active"
            - "expired"
            - "revoked"
        tenant:
          type: "string"
      required:
        - "access"
        - "created_at"
        - "expires_at"
        - "id"
        - "kind"
        - "refs"
        - "state"
        - "tenant"
      type: "object"
    TokenRequest:
      additionalProperties: false
      properties:
        access:
          enum:
            - "read"
            - "write"
        label:
          type: "string"
        refs:
          items:
            type: "string"
          type: "array"
        ttl_seconds:
          minimum: 1
          type: "integer"
      required:
        - "access"
        - "refs"
      type: "object"
    Tombstone:
      properties:
        kind:
          const: "opentine.tombstone"
        oid:
          pattern: "^(blob|event|run|attestation|annotation):sha256:[0-9a-f]{64}$"
          type: "string"
        signature:
          type: "object"
      required:
        - "kind"
        - "oid"
        - "signature"
      type: "object"
    TombstoneReply:
      additionalProperties: false
      properties:
        tombstone:
          $ref: "#/components/schemas/Tombstone"
      required:
        - "tombstone"
      type: "object"
    TombstoneStored:
      additionalProperties: false
      properties:
        purged:
          type: "boolean"
        stored:
          type: "boolean"
      required:
        - "purged"
        - "stored"
      type: "object"
    Updated:
      additionalProperties: false
      properties:
        updated:
          type: "boolean"
      required:
        - "updated"
      type: "object"
    UploadDeclaration:
      additionalProperties: false
      properties:
        sha256:
          pattern: "^[0-9a-f]{64}$"
          type: "string"
        size:
          minimum: 0
          type: "integer"
      required:
        - "sha256"
        - "size"
      type: "object"
    Usage:
      properties:
        tenant:
          type: "string"
        usage:
          properties:
            egress_bytes:
              properties:
                limit:
                  anyOf:
                    - minimum: 0
                      type: "integer"
                    - type: "null"
                used:
                  minimum: 0
                  type: "integer"
                window:
                  type: "string"
              required:
                - "limit"
                - "used"
                - "window"
              type: "object"
            mirror_bytes:
              properties:
                limit:
                  anyOf:
                    - minimum: 0
                      type: "integer"
                    - type: "null"
                used:
                  minimum: 0
                  type: "integer"
                window:
                  type: "string"
              required:
                - "limit"
                - "used"
                - "window"
              type: "object"
            runner_minutes:
              properties:
                limit:
                  anyOf:
                    - minimum: 0
                      type: "integer"
                    - type: "null"
                used:
                  minimum: 0
                  type: "integer"
                window:
                  type: "string"
              required:
                - "limit"
                - "used"
                - "window"
              type: "object"
            storage_bytes:
              properties:
                limit:
                  anyOf:
                    - minimum: 0
                      type: "integer"
                    - type: "null"
                used:
                  minimum: 0
                  type: "integer"
                window:
                  type: "string"
              required:
                - "limit"
                - "used"
                - "window"
              type: "object"
          required:
            - "egress_bytes"
            - "mirror_bytes"
            - "runner_minutes"
            - "storage_bytes"
          type: "object"
      required:
        - "tenant"
        - "usage"
      type: "object"
    Webhook:
      properties:
        created:
          type: "string"
        id:
          pattern: "^wh_[0-9a-f]{16}$"
          type: "string"
        kinds:
          items:
            type: "string"
          type: "array"
        url:
          type: "string"
      required:
        - "created"
        - "id"
        - "kinds"
        - "url"
      type: "object"
    WebhookList:
      additionalProperties: false
      properties:
        recent:
          type: "array"
        webhooks:
          items:
            $ref: "#/components/schemas/Webhook"
          type: "array"
      required:
        - "recent"
        - "webhooks"
      type: "object"
    WebhookRequest:
      additionalProperties: false
      properties:
        kinds:
          items:
            type: "string"
          type: "array"
        url:
          type: "string"
      required:
        - "url"
      type: "object"
  securitySchemes:
    bearer:
      description: "Token or OIDC JWT"
      scheme: "bearer"
      type: "http"
info:
  description: "The v1 HTTP API of `tine serve` and the hosted service. Tenant routes are private by default and authorized per tenant on every read; an object the caller may not read is a uniform 404. Routes marked x-opentine-status: planned are served only when GET /v1/capabilities advertises their x-opentine-cap. The server never signs as a user."
  license:
    identifier: "Apache-2.0"
    name: "Apache-2.0"
  title: "OpenTine remote API"
  version: "1.0.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
openapi: "3.1.0"
paths:
  "/v1/auth-methods":
    get:
      operationId: "getAuthMethods"
      responses:
        "200":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/AuthMethods"
          description: "OK"
      security: []
      summary: "How a client may authenticate"
      tags:
        - "protocol"
      x-opentine-cap: "limits"
      x-opentine-permission: null
      x-opentine-status: "stable"
  "/v1/auth/dev/login":
    post:
      operationId: "devLogin"
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/DevLogin"
        required: true
      responses:
        "201":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/SessionOpened"
          description: "Created"
        "400":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Bad request"
        "404":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not found (uniform: also when not visible to the caller)"
        "429":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Quota or throttle exceeded; honour Retry-After"
      security: []
      summary: "Development login with no proof (opt-in)"
      tags:
        - "admin"
      x-opentine-cap: "session"
      x-opentine-permission: null
      x-opentine-status: "stable"
  "/v1/auth/oidc-exchange":
    post:
      operationId: "exchangeCiToken"
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/OidcExchange"
        required: true
      responses:
        "201":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/IssuedToken"
          description: "Created"
        "401":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Authentication failed"
        "404":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not found (uniform: also when not visible to the caller)"
        "429":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Quota or throttle exceeded; honour Retry-After"
      security: []
      summary: "A CI job's OIDC ID token for a short-lived scoped token"
      tags:
        - "protocol"
      x-opentine-cap: "oidc_exchange"
      x-opentine-permission: null
      x-opentine-status: "stable"
  "/v1/auth/passkey/assertion":
    post:
      operationId: "passkeyLogin"
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PasskeyAssertion"
        required: true
      responses:
        "201":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/SessionOpened"
          description: "Created"
        "400":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Bad request"
        "404":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not found (uniform: also when not visible to the caller)"
        "429":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Quota or throttle exceeded; honour Retry-After"
      security: []
      summary: "Verify a passkey assertion; a session"
      tags:
        - "admin"
      x-opentine-cap: "session"
      x-opentine-permission: null
      x-opentine-status: "stable"
  "/v1/auth/passkey/assertion/options":
    post:
      operationId: "passkeyAssertionOptions"
      responses:
        "200":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PasskeyRequestOptions"
          description: "OK"
        "400":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Bad request"
        "404":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not found (uniform: also when not visible to the caller)"
        "429":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Quota or throttle exceeded; honour Retry-After"
      security: []
      summary: "WebAuthn request options for login"
      tags:
        - "admin"
      x-opentine-cap: "session"
      x-opentine-permission: null
      x-opentine-status: "stable"
  "/v1/auth/passkey/registration":
    post:
      operationId: "registerPasskey"
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PasskeyRegistration"
        required: true
      responses:
        "201":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PasskeyRegistered"
          description: "Created"
        "400":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Bad request"
        "404":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not found (uniform: also when not visible to the caller)"
        "429":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Quota or throttle exceeded; honour Retry-After"
      security: []
      summary: "Store a passkey's public key (never a private key)"
      tags:
        - "admin"
      x-opentine-cap: "session"
      x-opentine-permission: null
      x-opentine-status: "stable"
  "/v1/auth/passkey/registration/options":
    post:
      operationId: "passkeyRegistrationOptions"
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationStart"
        required: true
      responses:
        "200":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PasskeyCreationOptions"
          description: "OK"
        "400":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Bad request"
        "404":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not found (uniform: also when not visible to the caller)"
        "429":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Quota or throttle exceeded; honour Retry-After"
      security: []
      summary: "WebAuthn creation options (signed in, or with an invitation)"
      tags:
        - "admin"
      x-opentine-cap: "session"
      x-opentine-permission: null
      x-opentine-status: "stable"
  "/v1/capabilities":
    get:
      operationId: "getCapabilities"
      responses:
        "200":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Capabilities"
          description: "OK"
      security: []
      summary: "What this server speaks"
      tags:
        - "protocol"
      x-opentine-cap: null
      x-opentine-permission: null
      x-opentine-status: "stable"
  "/v1/invitations/accept":
    post:
      operationId: "acceptInvitation"
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/InvitationAccept"
        required: true
      responses:
        "200":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Tenant"
          description: "OK"
        "400":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Bad request"
        "401":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Authentication failed"
        "403":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Forbidden"
        "404":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Not found (uniform: also when not visible to the caller)"
        "409":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Conflict"
        "429":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Quota or throttle exceeded; honour Retry-After"
      summary: "Join a tenant with an invitation"
      tags:
        - "admin"
      x-opentine-cap: "tenancy"
      x-opentine-permission: "session"
      x-opentine-status: "stable"
  "/v1/limits":
    get:
      operationId: "getLimits"
      responses:
        "200":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Limits"
          description: "OK"
      security: []
      summary: "Published fair-use limits and quota policy"
      tags:
        - "protocol"
      x-opentine-cap: "limits"
      x-opentine-permission: null
      x-opentine-status: "stable"
  "/v1/session":
    delete:
      operationId: "endSession"
      responses:
        "200":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/SessionEnded"
          description: "OK"
        "401":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Authentication failed"
        "429":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          description: "Quota or throttle exceeded; honour Retry-After"
      summary: "Log out: end this session"
      tags:
        - "admin"
      x-opentine-cap: "session"
      x-opentine-permission: "session"
      x-opentine-status: "stable"
    get:
      operationId: "getSession"
      responses:
        "200":
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
          description: "OK"
        "401":
          content:
