[project]
name = "opentine"
version = "0.3.0"
description = "Git-shaped provenance for agent runs with verified objects, semantic forks, and universal usage accounting."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
authors = [{ name = "opentine contributors" }]
keywords = ["agents", "llm", "fork", "replay", "provenance", "repository", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "cryptography>=48.0.1",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.87"]
openai = ["openai>=1.75.0"]
google = ["google-genai>=2.8.0"]
# Kimi, DeepSeek, Qwen, GLM, Grok, Groq, Together, Mistral/Ministral,
# OpenRouter, and Hermes use the OpenAI SDK transport.
compat = ["openai>=1.75.0"]
# Ollama uses httpx (core dep) directly — no extra package needed
# MCP server (opentine.mcp_server) needs the mcp package
mcp = ["mcp>=1.28.1,<2"]
# Retained as a compatibility extra; signed catalogs and encrypted remotes use it in core.
crypto = ["cryptography>=48.0.1"]
all = [
    "anthropic>=0.87",
    "openai>=1.75.0",
    "google-genai>=2.8.0",
    "cryptography>=48.0.1",
]

dev = [
    "build>=1.2",
    "cryptography>=48.0.1",
    "hatchling==1.31.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "pytest-rerunfailures>=15.0",
    "ruff>=0.4",
    "twine>=5.0",
]

[project.scripts]
tine = "opentine.cli:main"

[project.urls]
Homepage = "https://opentine.com"
Repository = "https://github.com/0xcircuitbreaker/opentine"
Documentation = "https://github.com/0xcircuitbreaker/opentine/blob/v0.3.0/README.md"
Changelog = "https://github.com/0xcircuitbreaker/opentine/blob/v0.3.0/CHANGELOG.md"
Issues = "https://github.com/0xcircuitbreaker/opentine/issues"
Security = "https://github.com/0xcircuitbreaker/opentine/security/policy"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Keep local agent/editor state out even when it is ignored by a global Git
# configuration rather than this repository's .gitignore. The release inventory
# gate below additionally requires the archive to match Git's tracked files.
include = [
    "/.env.example",
    "/.gitattributes",
    "/.github/workflows",
    "/.gitignore",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/docs",
    "/examples",
    "/opentine",
    "/pyproject.toml",
    "/scripts",
    "/tests",
    "/uv.lock",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call real model providers or local live services",
    "live_harness: tests that call real external agent CLI harnesses",
]
