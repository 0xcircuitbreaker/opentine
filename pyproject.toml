[project]
name = "opentine"
version = "0.1.0"
description = "Local-first provenance for agent runs: content-addressed traces, fork, replay, and scoped resume."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "opentine contributors" }]
keywords = ["agents", "llm", "fork", "replay", "run-tree", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "msgspec>=0.19",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
google = ["google-genai>=1.0"]
# Kimi, DeepSeek, Qwen, GLM, Groq, Together, Mistral all use the openai SDK
compat = ["openai>=1.50"]
# Ollama uses httpx (core dep) directly — no extra package needed
all = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
]

dev = [
    "build>=1.2",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.4",
    "twine>=5.0",
]

[project.scripts]
tine = "opentine.cli:main"

[project.urls]
Homepage = "https://opentine.com"
Repository = "https://github.com/0xcircuitbreaker/opentine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call real model providers or local live services",
    "live_harness: tests that call real external agent CLI harnesses",
]
